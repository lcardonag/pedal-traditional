# AAMF local profile — use with SPRING_PROFILES_ACTIVE=aamf
# Requires: scripts/pedal-up.sh (Podman Compose: postgres + sqlserver)
# Requires: JDK 17+ to run Spring Boot 3.x (java.version in pom is legacy)

spring.datasource.customers.url=jdbc:postgresql://localhost:5432/redhatpedal
spring.datasource.customers.username=postgres
spring.datasource.customers.password=admin

spring.datasource.employees.url=jdbc:sqlserver://localhost:1433;databaseName=pedal;encrypt=false;trustServerCertificate=true
spring.datasource.employees.username=admin
spring.datasource.employees.password=admin1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
